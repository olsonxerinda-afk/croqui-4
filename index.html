
<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mapa de Mesas - Cristina & Ussumane</title>

<style>
* {
    box-sizing: border-box;
    font-family: 'Segoe UI', Arial, sans-serif;
}

body {
    margin: 0;
    padding: 20px;
    background: #f7f5f0;
    text-align: center;
}

.brand-title {
    color: #b89759;
    font-size: 35px;
    font-weight: bold;
    letter-spacing: 3px;
    margin: 10px;
    text-transform: uppercase;
}

h1 {
    color: #555;
    font-size: 17px;
    font-weight: normal;
    margin-bottom: 20px;
}

.search-container {
    width: 100%;
    max-width: 500px;
    margin: 0 auto 20px;
}

.search-input {
    width: 100%;
    padding: 15px 20px;
    border: 2px solid #b89759;
    border-radius: 30px;
    font-size: 16px;
    outline: none;
    background: white;
}

.search-input:focus {
    box-shadow: 0 0 12px #b8975966;
}

.no-results {
    min-height: 25px;
    margin-top: 10px;
    font-weight: bold;
}

.map-wrapper {
    position: relative;
    width: 100%;
    max-width: 1053px;
    margin: auto;
    overflow: hidden;
    border-radius: 12px;
    box-shadow: 0 8px 25px #0003;
}

.map-image {
    width: 100%;
    height: auto;
    display: block;
}

/* MARCADORES */

.pin {
    position: absolute;
    transform: translate(-50%, -50%);
    opacity: 0;
    pointer-events: none;
    transition: opacity .3s;
    z-index: 5;
}

.pin.active {
    opacity: 1;
    background: rgba(255, 0, 0, .30);
    border: 3px solid #ff2222;
    box-shadow: 0 0 20px 8px rgba(255, 0, 0, .65);
    animation: pulse 1s infinite alternate;
}

/* MESAS REDONDAS */

.pin.round {
    width: 12%;
    height: 9%;
    border-radius: 50%;
}

/* MESAS RECTANGULARES */

.pin.rectangle {
    width: 11%;
    height: 17%;
    border-radius: 9px;
}

/* MESAS INCLINADAS */

.pin.inclined {
    width: 18%;
    height: 13%;
    border-radius: 10px;
}

@keyframes pulse {
    from {
        transform: translate(-50%, -50%) scale(1);
    }
    to {
        transform: translate(-50%, -50%) scale(1.08);
    }
}

@media(max-width:600px) {
    body {
        padding: 10px;
    }

    .brand-title {
        font-size: 25px;
    }

    h1 {
        font-size: 14px;
    }

    .search-input {
        font-size: 14px;
    }

    .pin.active {
        border-width: 2px;
    }
}
</style>
</head>

<body>

<div class="brand-title">Cristina e Ussumane</div>

<h1>Localizador de Mesas</h1>

<div class="search-container">

    <input
        type="text"
        id="searchInput"
        class="search-input"
        placeholder="Digite o número da mesa..."
        autocomplete="off"
        list="sugestoes-mesas"
    >

    <datalist id="sugestoes-mesas">
        <option value="Mesa 1">
        <option value="Mesa 2">
        <option value="Mesa 3">
        <option value="Mesa 4">
        <option value="Mesa 6">
        <option value="Mesa 7">
        <option value="Mesa 8">
        <option value="Mesa 9">
        <option value="Mesa 10">
        <option value="Mesa 11">
        <option value="Mesa 12">
        <option value="Mesa 13">
        <option value="Mesa 14">
        <option value="Mesa 15">
        <option value="Mesa 16">
        <option value="Mesa 17">
        <option value="Mesa 18">
        <option value="Mesa 19">
        <option value="Mesa 20">
    </datalist>

    <div id="statusMessage" class="no-results"></div>

</div>

<div class="map-wrapper">

    <!-- IMAGEM DO MAPA 3D -->

    <img
        src="315420fd-b703-406c-84c4-124968df1b33.png"
        class="map-image"
        alt="Mapa 3D das mesas Cristina e Ussumane"
    >

    <!-- MESAS RECTANGULARES SUPERIORES -->

    <div class="pin rectangle" id="mesa1"
         style="left:30.2%;top:20.1%;"></div>

    <div class="pin rectangle" id="mesa2"
         style="left:71.7%;top:20.1%;"></div>

    <!-- MESAS REDONDAS SUPERIORES -->

    <div class="pin round" id="mesa11"
         style="left:14.7%;top:13.9%;"></div>

    <div class="pin round" id="mesa12"
         style="left:14.2%;top:24.3%;"></div>

    <div class="pin round" id="mesa8"
         style="left:86.1%;top:13.9%;"></div>

    <div class="pin round" id="mesa15"
         style="left:86.1%;top:24.3%;"></div>

    <!-- MESAS DA ZONA CENTRAL -->

    <div class="pin round" id="mesa6"
         style="left:22.8%;top:38.2%;"></div>

    <div class="pin round" id="mesa4"
         style="left:13.3%;top:46.9%;"></div>

    <div class="pin rectangle" id="mesa9"
         style="left:38.7%;top:44.4%;"></div>

    <div class="pin rectangle" id="mesa13"
         style="left:64.6%;top:44.4%;"></div>

    <div class="pin round" id="mesa20"
         style="left:83.1%;top:46.9%;"></div>

    <!-- MESAS DA ZONA INFERIOR -->

    <div class="pin round" id="mesa16"
         style="left:18.2%;top:59.7%;"></div>

    <div class="pin inclined" id="mesa17"
         style="left:36.6%;top:61.1%;"></div>

    <div class="pin inclined" id="mesa10"
         style="left:67%;top:60.4%;"></div>

    <div class="pin round" id="mesa14"
         style="left:86.4%;top:59.7%;"></div>

    <!-- MESAS DA ÚLTIMA FILA -->

    <div class="pin round" id="mesa18"
         style="left:18.5%;top:74.3%;"></div>

    <div class="pin round" id="mesa19"
         style="left:38.5%;top:74.3%;"></div>

    <div class="pin round" id="mesa7"
         style="left:69.3%;top:74.3%;"></div>

    <div class="pin round" id="mesa3"
         style="left:86.9%;top:74.3%;"></div>

</div>

<script>

const searchInput = document.getElementById("searchInput");
const statusMessage = document.getElementById("statusMessage");

const pins = document.querySelectorAll(".pin");

/* CRIAR LISTA DAS 20 MESAS */

const mesas = {};

for (let i = 1; i <= 20; i++) {

    mesas[String(i)] = "mesa" + i;

    mesas["mesa " + i] = "mesa" + i;

}

/* NORMALIZAR TEXTO */

function normalizar(texto) {

    return texto
        .trim()
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .replace(/\s+/g, " ");

}

/* PESQUISAR MESA */

function pesquisarMesa() {

    const query = normalizar(searchInput.value);

    // Limpar destaques anteriores

    pins.forEach(pin => {
        pin.classList.remove("active");
    });

    statusMessage.textContent = "";

    if (query === "") {
        return;
    }

    const targetId = mesas[query];

    // Verificar se a mesa existe

    if (!targetId) {

        statusMessage.style.color = "#d9534f";

        statusMessage.textContent =
            "Mesa não encontrada! Escolha uma mesa de 1 a 20.";

        return;
    }

    const target = document.getElementById(targetId);

    if (target) {

        // Destacar a mesa encontrada

        target.classList.add("active");

        // Mostrar confirmação

        statusMessage.style.color = "#198754";

        statusMessage.textContent =
            "Mesa " + targetId.replace("mesa", "") +
            " encontrada com sucesso!";

    }

}

/* PESQUISA AUTOMÁTICA */

searchInput.addEventListener("input", pesquisarMesa);

searchInput.addEventListener("change", pesquisarMesa);

</script>

</body>
</html>
